[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:influxdb]
command=/usr/bin/influxd --bolt-path=/data/influxdb/influxd.bolt --engine-path=/data/influxdb/engine --store=bolt
user=root
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/influxdb.log
stderr_logfile=/var/log/supervisor/influxdb_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:grafana]
command=/usr/share/grafana/bin/grafana-server --homepath=/usr/share/grafana --config=/etc/grafana/grafana.ini
user=grafana
directory=/usr/share/grafana
autostart=true
autorestart=true
priority=20
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/grafana.log
stderr_logfile=/var/log/supervisor/grafana_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=HOME="/usr/share/grafana",GF_PATHS_DATA="/data/grafana",GF_PATHS_LOGS="/var/log/grafana",GF_PATHS_PLUGINS="/data/grafana/plugins"

[program:collector]
command=python -m src.main
directory=/app/collector
user=root
autostart=true
autorestart=true
priority=30
startsecs=30
startretries=5
stdout_logfile=/var/log/supervisor/collector.log
stderr_logfile=/var/log/supervisor/collector_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:api]
command=uvicorn src.main:app --host 0.0.0.0 --port 8000
directory=/app/api
user=root
autostart=true
autorestart=true
priority=30
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

